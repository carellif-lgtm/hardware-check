name: PostgreSQL integration tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  postgres-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hardware_check_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hardware_check_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hardware_check_test
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest psycopg2-binary

      - name: Wait for PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          for attempt in {1..30}; do
            if pg_isready \
              --host=127.0.0.1 \
              --port=5432 \
              --username=postgres \
              --dbname=hardware_check_test; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1

      - name: Apply cache schema
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            --host=127.0.0.1 \
            --port=5432 \
            --username=postgres \
            --dbname=hardware_check_test \
            --set=ON_ERROR_STOP=1 \
            --file=cache_schema.sql

      - name: Run PostgreSQL integration tests
        run: python -m pytest -q tests/integration
